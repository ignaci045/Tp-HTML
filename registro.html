<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
</head>
<body>

    <header>
        <h1>Formulario de Registro de Usuario</h1>
    </header>

    <main>
        <form action="#" method="POST">
            
            <div>
                <label for="nombre">Nombre completo:</label><br>
                <input 
                    type="text" 
                    id="nombre" 
                    name="nombre_completo" 
                    placeholder="Ej: Juan Pérez" 
                    required 
                    tabindex="1">
            </div>
            <br>

            <div>
                <label for="email">Correo electronico:</label><br>
                <input 
                    type="email" 
                    id="email" 
                    name="correo_electronico" 
                    placeholder="Ej: correo@ejemplo.com" 
                    required 
                    tabindex="2">
            </div>
            <br>

            <div>
                <label for="password">Contraseña:</label><br>
                <input 
                    type="password" 
                    id="password" 
                    name="contrasena" 
                    placeholder="Minimo 8 caracteres" 
                    minlength="8" 
                    required 
                    tabindex="3">
            </div>
            <br>

            <fieldset>
                <legend>Seleccion de genero:</legend>
                
                <input 
                    type="radio" 
                    id="genero-masculino" 
                    name="genero" 
                    value="masculino" 
                    required 
                    tabindex="4">
                <label for="genero-masculino">Masculino</label><br>

                <input 
                    type="radio" 
                    id="genero-femenino" 
                    name="genero" 
                    value="femenino" 
                    tabindex="5">
                <label for="genero-femenino">Femenino</label><br>

                <input 
                    type="radio" 
                    id="genero-otro" 
                    name="genero" 
                    value="otro" 
                    tabindex="6">
                <label for="genero-otro">Otro</label>
            </fieldset>
            <br>

            
            <fieldset>
                <legend>Intereses:</legend>
                
                <input 
                    type="checkbox" 
                    id="interes-musica" 
                    name="intereses" 
                    value="musica" 
                    tabindex="7">
                <label for="interes-musica">Musica</label><br>

                <input 
                    type="checkbox" 
                    id="interes-deporte" 
                    name="intereses" 
                    value="deporte" 
                    tabindex="8">
                <label for="interes-deporte">Deporte</label><br>

                <input 
                    type="checkbox" 
                    id="interes-lectura" 
                    name="intereses" 
                    value="lectura" 
                    tabindex="9">
                <label for="interes-lectura">Lectura</label><br>

                <input 
                    type="checkbox" 
                    id="interes-tecnologia" 
                    name="intereses" 
                    value="tecnologia" 
                    tabindex="10">
                <label for="interes-tecnologia">Tecnologia</label>
            </fieldset>
            <br>

            <div>
                <label for="pais">País:</label><br>
                <select id="pais" name="pais" required tabindex="11">
                    <option value="" disabled selected>Seleccione un pais...</option>
                    <option value="argentina">Argentina</option>
                    <option value="brasil">Brasil</option>
                    <option value="chile">Chile</option>
                    <option value="uruguay">Uruguay</option>
                </select>
            </div>
            <br>

            <div>
                <label for="comentarios">Comentarios adicionales:</label><br>
                <textarea 
                    id="comentarios" 
                    name="comentarios_adicionales" 
                    rows="4" 
                    cols="40" 
                    placeholder="Escriba aquí sus comentarios..." 
                    tabindex="12"></textarea>
            </div>
            <br>

            <div>
                <input 
                    type="submit" 
                    value="Registrarse" 
                    tabindex="13">
            </div>

        </form>
    </main>

</body>
</html>
